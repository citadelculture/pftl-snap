name: PR6 bounded locked compiler and production build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr6-host-lite-locked-build
  cancel-in-progress: false
jobs:
  build:
    # Separate from the published boundary workflow. No repository settings or
    # workflow state is changed by publication; dispatch is separately reviewed.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'citadelculture/pftl-snap' }} # Proposed finite diagnostic runtime; separate review required.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact reviewed integration revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Checkout exact upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: postfiatorg/pftl-snap
          ref: 0820278c1cd38e6dd6a1ae38631889041bd6f9ba
          path: upstream
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Preserve inherited controls before trusted-host network setup
        run: /usr/bin/python3 -I control/qualification/pr6-lock/check-host-environment.py
      - name: Explicit trusted-host nftables preparation if missing
        timeout-minutes: 5
        run: |
          if ! command -v nft >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install --yes --no-install-recommends nftables
          fi
      - name: Require actual proof plus separate locked-build admission
        # Exact expiring admission and SHA are required before each phase.
        # Only host nftables may be provisioned above. No child tool/compiler setup.
        run: >-
          /usr/bin/python3 -I control/qualification/pr6-lock/run-locked-build.py
          --source "$GITHUB_WORKSPACE/upstream"
          --outputs "$GITHUB_WORKSPACE/pr6-build-evidence"
          --admission "$GITHUB_WORKSPACE/control/qualification/pr6-lock/admission/build-admission.json"
          --admission-sha256 931f7764d2c946a7227088dbfdb6cd594ca54ea3df2ecc0ca557dd7270c40d66
          --boundary-report "$GITHUB_WORKSPACE/control/qualification/pr6-lock/admission/boundary-report.json"
          --boundary-provenance "$GITHUB_WORKSPACE/control/qualification/pr6-lock/admission/boundary-provenance.json"
      - name: Preserve requested compiler and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-host-lite-locked-build
          path: |
            pr6-build-evidence/*.json
            pr6-build-evidence/*.stdout
            pr6-build-evidence/*.stderr
            pr6-build-evidence/*-inputs/*.json
            pr6-build-evidence/candidate-yarn.lock
            pr6-build-evidence/dist/**
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
