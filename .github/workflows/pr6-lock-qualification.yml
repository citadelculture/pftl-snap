name: PR6 confinement boundary only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pure helper qualification
        run: /usr/bin/python3 -I qualification/pr6-lock/boundary_helper_tests.py
      - name: Preserve inherited controls before trusted-host network setup
        run: /usr/bin/python3 -I qualification/pr6-lock/boundary_helper_tests.py --check-current-environment
      - name: Explicit trusted-host nftables preparation if missing
        timeout-minutes: 5
        run: |
          if ! command -v nft >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install --yes --no-install-recommends nftables
          fi
      - name: Boundary only; no dependency installation
        run: /usr/bin/python3 -I qualification/pr6-lock/boundary_host.py --output "${RUNNER_TEMP}/pr6-boundary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr6-confinement-boundary
          path: ${{ runner.temp }}/pr6-boundary-${{ github.run_id }}-${{ github.run_attempt }}/boundary-report.json
          if-no-files-found: error
          retention-days: 7
